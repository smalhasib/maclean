name: CI

# Pull requests only preview the release (tests run locally). No secrets are
# used, so a pull request from a fork can run this safely.
on:
  pull_request:

permissions:
  contents: read

jobs:
  preview:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # tags and history, for the release preview
      - name: Install git-cliff
        run: brew install git-cliff
      - name: Release preview
        run: |
          next="$(sh scripts/next-release.sh 2>/dev/null)"
          {
            echo "## Release preview"
            case "$next" in
              none)     echo "Merging this releases nothing (no \`feat:\`, \`fix:\` or \`perf:\` commits)." ;;
              breaking) echo "This has a breaking change. It will **not** release on its own; run the Release workflow with level \`major\`." ;;
              *)        echo "Merging this releases **v$next**."; echo; git cliff --config cliff.toml --unreleased --tag "v$next" --strip header 2>/dev/null ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
